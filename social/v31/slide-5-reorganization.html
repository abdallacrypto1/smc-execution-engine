<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Slide 5 — Reorganization</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0a0a0f; font-family: 'DM Sans', sans-serif; color: #e8e8f0; }
body {
  position: relative;
  padding: 90px 80px;
  display: flex;
  flex-direction: column;
}
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(26,26,46,0.7) 1px, transparent 1px),
    linear-gradient(90deg, rgba(26,26,46,0.7) 1px, transparent 1px);
  background-size: 80px 80px;
  opacity: 0.3;
  pointer-events: none;
}
.label {
  position: relative;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 26px;
  letter-spacing: 5px;
  color: #00ff88;
  text-transform: uppercase;
  margin-bottom: 20px;
}
.title {
  position: relative;
  font-size: 88px;
  font-weight: 900;
  line-height: 1.0;
  letter-spacing: -2px;
  margin-bottom: 30px;
}
.title .accent { color: #00ff88; }
.subtitle {
  position: relative;
  font-size: 36px;
  color: #8888a0;
  line-height: 1.4;
  margin-bottom: 60px;
  max-width: 880px;
}
.cats {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 26px;
  margin-top: 10px;
}
.cat {
  display: flex;
  align-items: center;
  gap: 32px;
  padding: 36px 40px;
  background: #12121e;
  border-radius: 16px;
  border-left: 6px solid;
}
.cat-icon {
  font-size: 64px;
  width: 90px;
  text-align: center;
  flex-shrink: 0;
}
.cat-name {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 44px;
  font-weight: 700;
  flex-shrink: 0;
  width: 220px;
}
.cat-desc {
  font-size: 28px;
  color: #8888a0;
  line-height: 1.4;
}
.cat.signal { border-color: #00ff88; }
.cat.signal .cat-name { color: #00ff88; }
.cat.visual { border-color: #a78bfa; }
.cat.visual .cat-name { color: #a78bfa; }
.cat.tools { border-color: #60a5fa; }
.cat.tools .cat-name { color: #60a5fa; }
.footer {
  position: relative;
  margin-top: auto;
  padding-top: 36px;
  font-size: 30px;
  color: #8888a0;
  text-align: center;
  font-style: italic;
}
</style>
</head>
<body>
<div class="label">SETTINGS</div>
<h1 class="title">Reorganizado<br>em <span class="accent">3 categorias</span>.</h1>
<p class="subtitle">O que afeta sinal versus o que é só cosmético — agora está visualmente separado.</p>

<div class="cats">
  <div class="cat signal">
    <div class="cat-icon">📡</div>
    <div class="cat-name">SIGNAL</div>
    <div class="cat-desc">Tudo que afeta quando o alerta dispara</div>
  </div>
  <div class="cat visual">
    <div class="cat-icon">🎨</div>
    <div class="cat-name">VISUAL</div>
    <div class="cat-desc">Cores, EMAs, fibs, OBs — só aparência</div>
  </div>
  <div class="cat tools">
    <div class="cat-icon">📊</div>
    <div class="cat-name">TOOLS</div>
    <div class="cat-desc">RSI Levels e ferramentas auxiliares</div>
  </div>
</div>

<div class="footer">Encontre o que importa, mais rápido.</div>
</body>
</html>
